name: Build & Release

# 每次 push 到 master：跑单测 → 构建 debug APK → 发布一个新的 Release。
# tag 形如 build-<构建号>，构建号与 APK 的 versionCode 同源（github.run_number），
# 应用内的"检查更新"就是拿已装的 versionCode 与最新 Release 的 tag 数字比较。
#
# 固定分享链接（永远指向最新构建）：
#   https://github.com/<owner>/<repo>/releases/latest/download/PocketNAI.apk
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

# 连续推送时排队执行而不是并发，避免两个发布互相覆盖。
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 与手机上现有安装同一把签名密钥：换一把密钥构建出的包无法覆盖安装，
      # 必须卸载重装（会丢掉本机生成历史与凭据）。密钥以 base64 存在仓库 Secret。
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        env:
          PNAI_VERSION_CODE: ${{ github.run_number }}
          PNAI_VERSION_NAME: 0.1.${{ github.run_number }}
        run: ./gradlew :app:assembleDebug

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="build-$RUN_NUMBER"
          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          NOTES="构建 #$RUN_NUMBER · 提交 $(git rev-parse --short HEAD) · $FIRST_LINE"
          gh release create "$TAG" \
            --title "0.1.$RUN_NUMBER" \
            --notes "$NOTES" \
            "app/build/outputs/apk/debug/app-debug.apk#PocketNAI.apk"

      # 只保留最近 3 个构建，避免 Release 列表越堆越长。
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[3:][] | .tagName' \
            | while read -r tag; do
                [ -n "$tag" ] && gh release delete "$tag" --yes --cleanup-tag
              done
