name: Build & Release

# 发布渠道有两条，**构建号同源**（都取"已有 Release 里最大的 build-N 加 1"），
# 因此不会互相撞号：
#   1. 日常：本地 `scripts/publish-release.ps1`（或双击"发布新版本.bat"）——
#      跑单测、构建、上传一条龙，不用等云端排队（2026-09-18 用户反馈云端慢）；
#   2. 备份：本 workflow，在 Actions 页面手动触发（workflow_dispatch）。
# 之前的"push 即构建"已取消：与本地发布并行会产生编号竞态，而且云端排队慢。
#
# tag 形如 build-<构建号>，与 APK 的 versionCode 同源 ——
# 应用内的"检查更新"就是拿已装的 versionCode 与最新 Release 的 tag 数字比较。
#
# 固定分享链接（永远指向最新构建）：
#   https://github.com/<owner>/<repo>/releases/latest/download/PocketNAI.apk
on:
  workflow_dispatch:
    inputs:
      message:
        description: 发布说明（留空取默认）
        required: false
        default: ""

permissions:
  contents: write

# 连续推送时排队执行而不是并发，避免两个发布互相覆盖。
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows 检出的仓库里 gradlew 没有可执行位（git 在 Windows 下默认不记录 filemode），
      # Linux runner 上直接执行会 "Permission denied"（exit 126，2026-09-18 首次运行即踩中）。
      # 索引里已把 gradlew 修正为 100755，这里再兜底一次，避免以后又被改回去。
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 与手机上现有安装同一把签名密钥：换一把密钥构建出的包无法覆盖安装，
      # 必须卸载重装（会丢掉本机生成历史与凭据）。密钥以 base64 存在仓库 Secret。
      #
      # 落点用 $RUNNER_TEMP 而不是 ~/.android：不赌 AGP 的默认查找位置，构建步骤里
      # 通过 PNAI_KEYSTORE_PATH 显式指定（2026-09-18 实测 ~/.android 方案在 runner 上
      # 没被采用，构建用了自动生成的密钥、更新包签名校验失败）。
      # 打印哈希用于与本机 `sha256sum ~/.android/debug.keystore` 对比，确认 Secret 无损。
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pocketnai-debug.keystore"
          ls -l "$RUNNER_TEMP/pocketnai-debug.keystore"
          sha256sum "$RUNNER_TEMP/pocketnai-debug.keystore"

      # 构建号与本地发布脚本同一规则：取已有 Release 里最大的 build-N 加 1。
      - name: Determine build number
        id: build_number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | sed -n 's/^build-\([0-9]\+\)$/\1/p' | sort -n | tail -1)
          echo "number=$(( ${LATEST:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        env:
          PNAI_KEYSTORE_PATH: ${{ runner.temp }}/pocketnai-debug.keystore
          PNAI_KEYSTORE_STORE_PASSWORD: android
          PNAI_KEYSTORE_ALIAS: androiddebugkey
          PNAI_KEYSTORE_KEY_PASSWORD: android
          PNAI_VERSION_CODE: ${{ steps.build_number.outputs.number }}
          PNAI_VERSION_NAME: 0.1.${{ steps.build_number.outputs.number }}
        run: ./gradlew :app:assembleDebug

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ steps.build_number.outputs.number }}
          INPUT_MESSAGE: ${{ inputs.message }}
        run: |
          TAG="build-$RUN_NUMBER"
          FIRST_LINE=$(printf '%s' "$INPUT_MESSAGE" | head -n 1)
          [ -z "$FIRST_LINE" ] && FIRST_LINE="手动触发的云端构建"
          NOTES="构建 #$RUN_NUMBER · 云端构建 · $FIRST_LINE"
          # 附件必须叫 PocketNAI.apk：应用侧的更新检测按这个名字找，
          # "releases/latest/download/PocketNAI.apk" 这个固定分享链接也认它。
          # （gh release create 的 `file#name` 改名语法实测不生效 —— build-2 的附件
          #  仍然叫 app-debug.apk —— 所以先改好文件名再上传。）
          cp app/build/outputs/apk/debug/app-debug.apk PocketNAI.apk
          gh release create "$TAG" \
            --title "0.1.$RUN_NUMBER" \
            --notes "$NOTES" \
            PocketNAI.apk

      # 只保留最近 3 个构建，避免 Release 列表越堆越长。
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[3:][] | .tagName' \
            | while read -r tag; do
                [ -n "$tag" ] && gh release delete "$tag" --yes --cleanup-tag
              done
