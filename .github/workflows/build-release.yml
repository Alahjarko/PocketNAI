name: Build & Release

# 发布渠道有两条，**构建号同源**（都取"已有 Release 里最大的 build-N 加 1"），
# 因此不会互相撞号：
#   1. 日常：本地 `scripts/publish-release.ps1`（或双击"发布新版本.bat"）——
#      跑单测、构建、上传一条龙，不用等云端排队（2026-09-18 用户反馈云端慢）；
#   2. 备份：本 workflow，在 Actions 页面手动触发（workflow_dispatch）。
# 之前的"push 即构建"已取消：与本地发布并行会产生编号竞态，而且云端排队慢。
#
# tag 形如 build-<构建号>，与 APK 的 versionCode 同源 ——
# 应用内的"检查更新"就是拿已装的 versionCode 与最新 Release 的 tag 数字比较。
#
# 固定分享链接（永远指向最新构建）：
#   https://github.com/<owner>/<repo>/releases/latest/download/PocketNAI.apk
on:
  workflow_dispatch:
    inputs:
      message:
        description: 发布说明（留空取默认）
        required: false
        default: ""

permissions:
  contents: write

# 连续推送时排队执行而不是并发，避免两个发布互相覆盖。
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows 检出的仓库里 gradlew 没有可执行位（git 在 Windows 下默认不记录 filemode），
      # Linux runner 上直接执行会 "Permission denied"（exit 126，2026-09-18 首次运行即踩中）。
      # 索引里已把 gradlew 修正为 100755，这里再兜底一次，避免以后又被改回去。
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK (no emulator)
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false

      # 与手机上现有安装同一把签名密钥：换一把密钥构建出的包无法覆盖安装，
      # 必须卸载重装（会丢掉本机生成历史与凭据）。密钥以 base64 存在仓库 Secret。
      #
      # 落点用 $RUNNER_TEMP 而不是 ~/.android：不赌 AGP 的默认查找位置，构建步骤里
      # 通过 PNAI_KEYSTORE_PATH 显式指定（2026-09-18 实测 ~/.android 方案在 runner 上
      # 没被采用，构建用了自动生成的密钥、更新包签名校验失败）。
      # 打印哈希用于与本机 `sha256sum ~/.android/debug.keystore` 对比，确认 Secret 无损。
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pocketnai-debug.keystore"
          ls -l "$RUNNER_TEMP/pocketnai-debug.keystore"
          sha256sum "$RUNNER_TEMP/pocketnai-debug.keystore"

      # 构建号与本地发布脚本同一规则：取已有 Release 里最大的 build-N 加 1。
      - name: Determine build number
        id: build_number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | sed -n 's/^build-\([0-9]\+\)$/\1/p' | sort -n | tail -1)
          echo "number=$(( ${LATEST:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build optimized APK
        env:
          PNAI_KEYSTORE_PATH: ${{ runner.temp }}/pocketnai-debug.keystore
          PNAI_KEYSTORE_STORE_PASSWORD: android
          PNAI_KEYSTORE_ALIAS: androiddebugkey
          PNAI_KEYSTORE_KEY_PASSWORD: android
          PNAI_VERSION_CODE: ${{ steps.build_number.outputs.number }}
          PNAI_VERSION_NAME: 0.1.${{ steps.build_number.outputs.number }}
        run: ./gradlew :app:assembleRelease

      - name: Inspect packaged share task configuration
        run: |
          python3 scripts/verify-share-manifest.py app/build/outputs/apk/release/app-release.apk --version-code "${{ steps.build_number.outputs.number }}" --xml-output app/build/reports/packaged-manifest.xml

      - name: Verify signing compatibility with latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIOUS_DIR="$RUNNER_TEMP/previous-pocketnai-release"
          mkdir -p "$PREVIOUS_DIR"
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern PocketNAI.apk --dir "$PREVIOUS_DIR"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$PREVIOUS_DIR/PocketNAI.apk" > "$RUNNER_TEMP/previous-cert.txt"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/current-cert.txt"
          python3 - "$RUNNER_TEMP/previous-cert.txt" "$RUNNER_TEMP/current-cert.txt" <<'PY'
          import pathlib, re, sys
          def certificates(path):
              values = re.findall(r"^(?:V[0-9.]+\s+)?Signer[^\n]*certificate SHA-256 digest:\s*([0-9a-f]{64})", pathlib.Path(path).read_text(), re.M | re.I)
              if not values:
                  raise SystemExit("APK signing certificate could not be verified")
              return {value.lower() for value in values}
          if certificates(sys.argv[1]) != certificates(sys.argv[2]):
              raise SystemExit("Signing certificate differs from latest release; refusing to publish")
          print("Signing certificate matches the latest release")
          PY
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Preserve verified APK and test reports
        uses: actions/upload-artifact@v4
        with:
          name: pocketnai-release-${{ steps.build_number.outputs.number }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/packaged-manifest.xml
          retention-days: 14

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ steps.build_number.outputs.number }}
          INPUT_MESSAGE: ${{ inputs.message }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          TAG="build-$RUN_NUMBER"
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/pocketnai-release-notes.md"
          if [ -n "$INPUT_MESSAGE" ]; then
            printf '%s\n' "$INPUT_MESSAGE" > "$NOTES_FILE"
          else
            printf '构建 #%s · 云端构建\n' "$RUN_NUMBER" > "$NOTES_FILE"
          fi
          # 附件必须叫 PocketNAI.apk：应用侧的更新检测按这个名字找，
          # "releases/latest/download/PocketNAI.apk" 这个固定分享链接也认它。
          # （gh release create 的 `file#name` 改名语法实测不生效 —— build-2 的附件
          #  仍然叫 app-debug.apk —— 所以先改好文件名再上传。）
          cp app/build/outputs/apk/release/app-release.apk PocketNAI.apk
          gh release create "$TAG" \
            --title "0.1.$RUN_NUMBER" \
            --target "$BUILD_SHA" \
            --latest \
            --notes-file "$NOTES_FILE" \
            PocketNAI.apk
