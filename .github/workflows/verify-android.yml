name: Verify Android (no emulator)
on:
  push:
    branches: [feat/anlas-statistics]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - name: Restore existing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pocketnai.keystore"
      - name: Determine review build version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | sed -n 's/^build-\([0-9]\+\)$/\1/p' | sort -n | tail -1)
          echo "PNAI_VERSION_CODE=$(( ${LATEST:-0} + 1 ))" >> "$GITHUB_ENV"
          echo "PNAI_VERSION_NAME=0.1.$(( ${LATEST:-0} + 1 ))-stats-review" >> "$GITHUB_ENV"
      - name: JVM regression tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Render production UI on host JVM
        run: ./gradlew :app:renderStatsPreview -PrenderStatsPreview=true --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pocketnai-ui-previews
          path: app/build/reports/paparazzi/
          retention-days: 14
      - name: Build APKs and compile device tests (no device execution)
        env:
          PNAI_KEYSTORE_PATH: ${{ runner.temp }}/pocketnai.keystore
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace
      - name: Verify signing matches build-24
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download build-24 --repo "$GITHUB_REPOSITORY" --pattern PocketNAI.apk --dir "$RUNNER_TEMP/previous"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/previous/PocketNAI.apk" > "$RUNNER_TEMP/previous-cert.txt"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/current-cert.txt"
          cat "$RUNNER_TEMP/previous-cert.txt" "$RUNNER_TEMP/current-cert.txt"
          python3 - "$RUNNER_TEMP/previous-cert.txt" "$RUNNER_TEMP/current-cert.txt" <<'PY'
          import pathlib, re, sys
          def certs(path):
              values = set(re.findall(r"^Signer[^\n]*certificate SHA-256 digest:\s*([0-9a-f]{64})", pathlib.Path(path).read_text(), re.M | re.I))
              assert values, 'No signing certificate'
              return {value.lower() for value in values}
          assert certs(sys.argv[1]) == certs(sys.argv[2]), 'Signing certificate mismatch'
          print('Signing matches build-24')
          PY
          sha256sum app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocketnai-statistics-review
          path: |
            app/build/outputs/apk/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/paparazzi/
          retention-days: 14
